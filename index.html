    function parsePairs(text) {
      return text.split(',').map(pair => pair.trim()).filter(Boolean);
    }

    function showNextBatch() {
      const num = parseInt(document.getElementById("numPerBatch").value);
      const batch = allPairs.slice(index, index + num);
      if (batch.length === 0) {
        clearInterval(timer);
        notify("❌ Hết từ vựng để hiển thị.");
        return;
      }
      document.getElementById("words").innerHTML = batch.map(w => `<div>${w}</div>`).join('');
      notify(`✅ Đã hiển thị ${batch.length} cặp từ.`);
      index += num;
    }

    function notify(msg) {
      if (Notification.permission === "granted") {
        new Notification(msg);
      }
    }

    function start() {
      index = 0;
      paused = false;
      allPairs = parsePairs(rawText);
      showNextBatch();
      const delay = parseInt(document.getElementById("delay").value) * 1000;
      clearInterval(timer);
      timer = setInterval(() => {
        if (!paused) showNextBatch();
      }, delay);
    }

    function pause() {
      paused = true;
    }

    function resume() {
      paused = false;
    }

    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }
